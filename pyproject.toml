[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnvalidate"
version = "0.1.0"
description = "Perimeter validator/ranker for AI-predicted 3D RNA structures against experimental data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]
keywords = ["rna", "validation", "fret", "cryo-em", "shape", "sanity-check", "aptamer"]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/amurlaniakea/rnvalidate"
Repository = "https://github.com/amurlaniakea/rnvalidate"

[project.scripts]
rnvalidate = "rnvalidate.cli:main"

[project.optional-dependencies]
testing = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4"]

[tool.setuptools]
package-dir = { "" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rnvalidate"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
